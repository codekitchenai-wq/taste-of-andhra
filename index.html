<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DirectApp — multi-tenant software helping restaurants and SMEs grow. Empowering SME digital presence & growth."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&family=Syne:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>directapp.in</title>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(location.search)
          var tenant = (params.get('tenant') || '').trim().toLowerCase()
          if (!tenant) return
          var host = location.hostname.toLowerCase()
          var root = 'directapp.in'
          var currentSlug = null
          if (host.endsWith('.' + root) && host !== root && host !== 'www.' + root) {
            var prefix = host.slice(0, -(root.length + 1))
            var parts = prefix.split('.')
            if (parts.length === 1 && parts[0]) currentSlug = parts[0]
            else if (parts.length === 2 && parts[0] === 'www' && parts[1]) {
              currentSlug = parts[1]
            }
          }
          if (currentSlug === tenant) return
          if (host === root || host === 'www.' + root) return
          if (
            host === 'thetasteofandhra.com' ||
            host === 'www.thetasteofandhra.com'
          ) {
            return
          }
          var hasCode = params.has('code') || params.has('access_token')
          var hash = location.hash || ''
          if (
            hash.indexOf('access_token') !== -1 ||
            hash.indexOf('refresh_token') !== -1
          ) {
            hasCode = true
          }
          var path = hasCode ? '/login' : location.pathname || '/'
          location.replace(
            'https://' + tenant + '.' + root + path + location.search + hash,
          )
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
